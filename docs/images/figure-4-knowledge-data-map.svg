<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge and data map</title>
  <desc id="desc">A visual map connecting operational tables, knowledge tables, RAG retrieval, specialist agents, and customer-facing pages.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4a6580"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#102b3a" flood-opacity=".12"/>
    </filter>
    <style>
      .title { font: 800 46px Inter, Segoe UI, Arial, sans-serif; fill: #13283a; }
      .subtitle { font: 500 20px Inter, Segoe UI, Arial, sans-serif; fill: #5e7084; }
      .panel { fill: #ffffff; stroke: #d9e4ec; stroke-width: 2; filter: url(#shadow); }
      .panelTitle { font: 800 27px Inter, Segoe UI, Arial, sans-serif; fill: #16304a; }
      .item { fill: #f6f9fc; stroke: #d9e4ec; stroke-width: 1.5; }
      .itemText { font: 600 18px Inter, Segoe UI, Arial, sans-serif; fill: #3c5065; }
      .line { stroke: #4a6580; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
      .core { fill: #17344d; }
      .coreText { font: 800 23px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .caption { font: 500 16px Inter, Segoe UI, Arial, sans-serif; fill: #63778b; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="90" class="title">Knowledge and Data Map</text>
  <text x="80" y="128" class="subtitle">The system combines structured business records with retrieval-ready policy and case knowledge.</text>

  <rect x="85" y="190" width="360" height="560" rx="24" class="panel"/>
  <text x="125" y="245" class="panelTitle">Operational Records</text>
  <rect x="125" y="285" width="280" height="46" rx="12" class="item"/>
  <text x="150" y="315" class="itemText">customers</text>
  <rect x="125" y="350" width="280" height="46" rx="12" class="item"/>
  <text x="150" y="380" class="itemText">orders and order_items</text>
  <rect x="125" y="415" width="280" height="46" rx="12" class="item"/>
  <text x="150" y="445" class="itemText">shipments and events</text>
  <rect x="125" y="480" width="280" height="46" rx="12" class="item"/>
  <text x="150" y="510" class="itemText">refund_requests</text>
  <rect x="125" y="545" width="280" height="46" rx="12" class="item"/>
  <text x="150" y="575" class="itemText">complaints</text>
  <rect x="125" y="610" width="280" height="46" rx="12" class="item"/>
  <text x="150" y="640" class="itemText">sessions and messages</text>
  <rect x="125" y="675" width="280" height="46" rx="12" class="item"/>
  <text x="150" y="705" class="itemText">agent_events</text>

  <rect x="1155" y="190" width="360" height="560" rx="24" class="panel"/>
  <text x="1195" y="245" class="panelTitle">RAG-v2 Knowledge</text>
  <rect x="1195" y="305" width="280" height="54" rx="14" class="item"/>
  <text x="1220" y="339" class="itemText">knowledge_documents</text>
  <rect x="1195" y="385" width="280" height="54" rx="14" class="item"/>
  <text x="1220" y="419" class="itemText">knowledge_chunks</text>
  <rect x="1195" y="465" width="280" height="54" rx="14" class="item"/>
  <text x="1220" y="499" class="itemText">policy_rules</text>
  <rect x="1195" y="545" width="280" height="54" rx="14" class="item"/>
  <text x="1220" y="579" class="itemText">historical_cases</text>
  <rect x="1195" y="625" width="280" height="54" rx="14" class="item"/>
  <text x="1220" y="659" class="itemText">customer_tags</text>

  <circle cx="800" cy="450" r="135" class="core"/>
  <text x="800" y="424" class="coreText">Business-Aware</text>
  <text x="800" y="460" class="coreText">Agentic RAG</text>
  <text x="800" y="496" class="coreText">Decision Core</text>

  <rect x="595" y="190" width="410" height="95" rx="22" class="panel"/>
  <text x="635" y="231" class="panelTitle">Grounded Answers</text>
  <text x="635" y="262" class="caption">Policy-backed explanations and safer customer replies</text>

  <rect x="595" y="615" width="410" height="95" rx="22" class="panel"/>
  <text x="635" y="656" class="panelTitle">Stateful Operations</text>
  <text x="635" y="687" class="caption">Refunds, support tickets, messages, and audit events</text>

  <path class="line" d="M445 450 C540 450 600 450 665 450"/>
  <path class="line" d="M1135 450 C1050 450 1000 450 935 450"/>
  <path class="line" d="M800 315 L800 285"/>
  <path class="line" d="M800 585 L800 615"/>
  <path class="line" d="M800 285 C800 260 760 250 720 250"/>
  <path class="line" d="M800 615 C800 640 760 650 720 650"/>

  <rect x="80" y="805" width="1440" height="48" rx="16" fill="#ecf3ff" stroke="#c9d8f6"/>
  <text x="120" y="836" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#1d4f93">Schema principle:</text>
  <text x="280" y="836" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#3f5874">SQLAlchemy models are the active source of truth; legacy SQL files are reference material only.</text>
</svg>
