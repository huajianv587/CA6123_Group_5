<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verification pipeline</title>
  <desc id="desc">Testing and acceptance pipeline with unit tests, safety evaluation, Supabase verification, API smoke, frontend build, browser click test, and load test.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2d6d64"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#102b3a" flood-opacity=".13"/>
    </filter>
    <style>
      .title { font: 800 46px Inter, Segoe UI, Arial, sans-serif; fill: #10283e; }
      .subtitle { font: 500 20px Inter, Segoe UI, Arial, sans-serif; fill: #617386; }
      .stage { fill: #ffffff; stroke: #d8e4ec; stroke-width: 2; filter: url(#shadow); }
      .stageTitle { font: 800 22px Inter, Segoe UI, Arial, sans-serif; fill: #14314a; }
      .stageBody { font: 500 16px Inter, Segoe UI, Arial, sans-serif; fill: #627589; }
      .pass { fill: #1f9c68; }
      .warn { fill: #da8b2b; }
      .line { stroke: #2d6d64; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .badgeText { font: 900 18px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .summary { font: 800 24px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .summarySmall { font: 500 18px Inter, Segoe UI, Arial, sans-serif; fill: #d8ecff; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f7fafc"/>
  <text x="80" y="90" class="title">Delivery Verification Pipeline</text>
  <text x="80" y="128" class="subtitle">The project is evaluated as a working system: code, API, database, frontend, browser flow, and light load behavior.</text>

  <rect x="90" y="230" width="230" height="160" rx="24" class="stage"/>
  <circle cx="128" cy="268" r="22" class="pass"/>
  <text x="128" y="275" class="badgeText">1</text>
  <text x="118" y="320" class="stageTitle">Pytest</text>
  <text x="118" y="352" class="stageBody">Routing, agents,</text>
  <text x="118" y="376" class="stageBody">API, safety, RAG</text>

  <rect x="390" y="230" width="230" height="160" rx="24" class="stage"/>
  <circle cx="428" cy="268" r="22" class="pass"/>
  <text x="428" y="275" class="badgeText">2</text>
  <text x="418" y="320" class="stageTitle">Safety Eval</text>
  <text x="418" y="352" class="stageBody">Guardrails, redaction,</text>
  <text x="418" y="376" class="stageBody">escalation rules</text>

  <rect x="690" y="230" width="230" height="160" rx="24" class="stage"/>
  <circle cx="728" cy="268" r="22" class="pass"/>
  <text x="728" y="275" class="badgeText">3</text>
  <text x="718" y="320" class="stageTitle">Supabase</text>
  <text x="718" y="352" class="stageBody">Create tables and</text>
  <text x="718" y="376" class="stageBody">seed demo data</text>

  <rect x="990" y="230" width="230" height="160" rx="24" class="stage"/>
  <circle cx="1028" cy="268" r="22" class="pass"/>
  <text x="1028" y="275" class="badgeText">4</text>
  <text x="1018" y="320" class="stageTitle">API Smoke</text>
  <text x="1018" y="352" class="stageBody">Readonly and</text>
  <text x="1018" y="376" class="stageBody">write-demo checks</text>

  <rect x="260" y="515" width="230" height="160" rx="24" class="stage"/>
  <circle cx="298" cy="553" r="22" class="pass"/>
  <text x="298" y="560" class="badgeText">5</text>
  <text x="288" y="605" class="stageTitle">Frontend Build</text>
  <text x="288" y="637" class="stageBody">TypeScript and</text>
  <text x="288" y="661" class="stageBody">Vite production build</text>

  <rect x="610" y="515" width="230" height="160" rx="24" class="stage"/>
  <circle cx="648" cy="553" r="22" class="pass"/>
  <text x="648" y="560" class="badgeText">6</text>
  <text x="638" y="605" class="stageTitle">Browser Clicks</text>
  <text x="638" y="637" class="stageBody">Landing, nav, chat,</text>
  <text x="638" y="661" class="stageBody">orders, languages</text>

  <rect x="960" y="515" width="230" height="160" rx="24" class="stage"/>
  <circle cx="998" cy="553" r="22" class="warn"/>
  <text x="998" y="560" class="badgeText">7</text>
  <text x="988" y="605" class="stageTitle">Light Load</text>
  <text x="988" y="637" class="stageBody">6 concurrent workers</text>
  <text x="988" y="661" class="stageBody">54 successful requests</text>

  <path class="line" d="M320 310 L390 310"/>
  <path class="line" d="M620 310 L690 310"/>
  <path class="line" d="M920 310 L990 310"/>
  <path class="line" d="M1105 390 C1040 480 820 475 725 515"/>
  <path class="line" d="M490 595 L610 595"/>
  <path class="line" d="M840 595 L960 595"/>

  <rect x="80" y="765" width="1440" height="72" rx="24" fill="#17344d"/>
  <text x="120" y="808" class="summary">Acceptance result:</text>
  <text x="345" y="808" class="summarySmall">full demo flow passes; high concurrency should be optimized before production deployment.</text>
</svg>
