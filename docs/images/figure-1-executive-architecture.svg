<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Smart Service Center executive architecture</title>
  <desc id="desc">Layered visual architecture showing the user portal, API service, safety layer, agent routing, RAG knowledge, database, and support tickets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#f7fbf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#18324a" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#327266"/>
    </marker>
    <style>
      .title { font: 800 44px Inter, Segoe UI, Arial, sans-serif; fill: #16253a; }
      .subtitle { font: 500 20px Inter, Segoe UI, Arial, sans-serif; fill: #50627a; }
      .layer { fill: #ffffff; stroke: #d5e3ee; stroke-width: 2; filter: url(#shadow); }
      .small { font: 600 18px Inter, Segoe UI, Arial, sans-serif; fill: #34465e; }
      .label { font: 800 23px Inter, Segoe UI, Arial, sans-serif; fill: #17344d; }
      .caption { font: 500 16px Inter, Segoe UI, Arial, sans-serif; fill: #607389; }
      .chip { fill: #edf5f1; stroke: #bcd9cf; stroke-width: 1.5; }
      .chip2 { fill: #eef4ff; stroke: #c4d5f5; stroke-width: 1.5; }
      .chip3 { fill: #fff5e7; stroke: #f0d1a1; stroke-width: 1.5; }
      .accent { fill: #21a06f; }
      .accent2 { fill: #3263c7; }
      .accent3 { fill: #dd8a20; }
      .line { stroke: #327266; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">Smart Service Center Architecture</text>
  <text x="80" y="122" class="subtitle">A customer-facing, database-backed, agentic RAG service system for orders, delivery, refunds, and complaints.</text>

  <rect x="70" y="185" width="280" height="530" rx="24" class="layer"/>
  <circle cx="118" cy="236" r="24" class="accent"/>
  <text x="158" y="244" class="label">Customer Portal</text>
  <text x="105" y="300" class="small">Landing Page</text>
  <text x="105" y="345" class="small">Live Chat</text>
  <text x="105" y="390" class="small">My Orders</text>
  <text x="105" y="435" class="small">Returns &amp; Refunds</text>
  <text x="105" y="480" class="small">Help Center</text>
  <text x="105" y="525" class="small">Support Tickets</text>
  <text x="105" y="590" class="caption">Bilingual UI</text>
  <text x="105" y="620" class="caption">No direct Supabase key</text>

  <rect x="440" y="185" width="270" height="530" rx="24" class="layer"/>
  <circle cx="488" cy="236" r="24" class="accent2"/>
  <text x="528" y="244" class="label">FastAPI Service</text>
  <rect x="482" y="290" width="185" height="50" rx="14" class="chip2"/>
  <text x="520" y="322" class="small">REST API</text>
  <rect x="482" y="365" width="185" height="50" rx="14" class="chip2"/>
  <text x="505" y="397" class="small">Orchestrator</text>
  <rect x="482" y="440" width="185" height="50" rx="14" class="chip2"/>
  <text x="510" y="472" class="small">Persistence</text>
  <text x="475" y="560" class="caption">Commits every service action</text>
  <text x="475" y="590" class="caption">Exposes typed demo endpoints</text>

  <rect x="800" y="120" width="310" height="240" rx="24" class="layer"/>
  <circle cx="850" cy="172" r="24" class="accent3"/>
  <text x="890" y="180" class="label">Safety Layer</text>
  <text x="840" y="235" class="small">Prompt-injection block</text>
  <text x="840" y="280" class="small">PII redaction</text>
  <text x="840" y="325" class="small">Escalation rules</text>

  <rect x="800" y="455" width="310" height="260" rx="24" class="layer"/>
  <circle cx="850" cy="507" r="24" class="accent"/>
  <text x="890" y="515" class="label">Agent Router</text>
  <text x="835" y="570" class="small">OrderAgent</text>
  <text x="835" y="615" class="small">LogisticsAgent</text>
  <text x="835" y="660" class="small">RefundAgent</text>
  <text x="835" y="705" class="small">ComplaintAgent</text>

  <rect x="1210" y="120" width="300" height="270" rx="24" class="layer"/>
  <circle cx="1260" cy="172" r="24" class="accent2"/>
  <text x="1300" y="180" class="label">RAG-v2</text>
  <text x="1245" y="235" class="small">Policy rules</text>
  <text x="1245" y="280" class="small">Historical cases</text>
  <text x="1245" y="325" class="small">Customer tags</text>
  <text x="1245" y="360" class="caption">Grounded refund reasoning</text>

  <rect x="1210" y="485" width="300" height="230" rx="24" class="layer"/>
  <circle cx="1260" cy="537" r="24" class="accent3"/>
  <text x="1300" y="545" class="label">Business Data</text>
  <text x="1245" y="600" class="small">Orders and shipments</text>
  <text x="1245" y="645" class="small">Refund requests</text>
  <text x="1245" y="690" class="small">Sessions and tickets</text>

  <path class="line" d="M350 450 C390 450 400 450 440 450"/>
  <path class="line" d="M710 385 C760 340 760 260 800 245"/>
  <path class="line" d="M710 515 C760 560 760 595 800 600"/>
  <path class="line" d="M1110 590 C1160 560 1160 590 1210 600"/>
  <path class="line" d="M1110 535 C1160 420 1160 270 1210 250"/>

  <rect x="80" y="770" width="1440" height="70" rx="22" fill="#16324a"/>
  <text x="120" y="813" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Delivery loop:</text>
  <text x="275" y="813" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#d8ecff">Customer question -> safe routing -> specialist action -> grounded answer -> database record -> support escalation when needed</text>
</svg>
