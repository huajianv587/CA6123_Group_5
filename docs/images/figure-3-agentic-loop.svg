<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agentic service loop</title>
  <desc id="desc">Circular agentic workflow showing perceive, route, act, ground, protect, write records, and escalate.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2f6b7e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#102b3a" flood-opacity=".14"/>
    </filter>
    <style>
      .title { font: 800 46px Inter, Segoe UI, Arial, sans-serif; fill: #122b3d; }
      .subtitle { font: 500 20px Inter, Segoe UI, Arial, sans-serif; fill: #617386; }
      .node { fill: #ffffff; stroke: #d6e4ec; stroke-width: 2; filter: url(#shadow); }
      .head { font: 800 23px Inter, Segoe UI, Arial, sans-serif; fill: #14314a; text-anchor: middle; }
      .body { font: 500 16px Inter, Segoe UI, Arial, sans-serif; fill: #5b6e82; text-anchor: middle; }
      .center { fill: #17344d; }
      .centerText { font: 800 25px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .ring { stroke: #2f6b7e; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .pill { fill: #eef7f3; stroke: #c6dfd5; stroke-width: 2; }
      .pillText { font: 700 17px Inter, Segoe UI, Arial, sans-serif; fill: #225543; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f7fafc"/>
  <text x="80" y="90" class="title">Agentic Service Loop</text>
  <text x="80" y="128" class="subtitle">The assistant is organized as an operational loop: understand, route, act, ground, protect, persist, and escalate.</text>

  <path class="ring" d="M800 188 C1060 188 1260 300 1260 450"/>
  <path class="ring" d="M1260 450 C1260 650 1060 760 800 760"/>
  <path class="ring" d="M800 760 C540 760 340 650 340 450"/>
  <path class="ring" d="M340 450 C340 300 540 188 800 188"/>

  <circle cx="800" cy="450" r="125" class="center"/>
  <text x="800" y="430" class="centerText">Customer</text>
  <text x="800" y="465" class="centerText">Service</text>
  <text x="800" y="500" class="centerText">Orchestrator</text>

  <rect x="650" y="120" width="300" height="120" rx="24" class="node"/>
  <text x="800" y="168" class="head">Perceive</text>
  <text x="800" y="200" class="body">Session context, entities,</text>
  <text x="800" y="224" class="body">customer request signals</text>

  <rect x="1045" y="305" width="300" height="120" rx="24" class="node"/>
  <text x="1195" y="353" class="head">Route</text>
  <text x="1195" y="385" class="body">Choose order, logistics,</text>
  <text x="1195" y="409" class="body">refund, or complaint agent</text>

  <rect x="1045" y="565" width="300" height="120" rx="24" class="node"/>
  <text x="1195" y="613" class="head">Act</text>
  <text x="1195" y="645" class="body">Read or write business</text>
  <text x="1195" y="669" class="body">records through SQLAlchemy</text>

  <rect x="650" y="700" width="300" height="120" rx="24" class="node"/>
  <text x="800" y="748" class="head">Ground</text>
  <text x="800" y="780" class="body">Retrieve policy rules,</text>
  <text x="800" y="804" class="body">cases, and customer tags</text>

  <rect x="255" y="565" width="300" height="120" rx="24" class="node"/>
  <text x="405" y="613" class="head">Protect</text>
  <text x="405" y="645" class="body">Block prompt injection,</text>
  <text x="405" y="669" class="body">redact sensitive content</text>

  <rect x="255" y="305" width="300" height="120" rx="24" class="node"/>
  <text x="405" y="353" class="head">Escalate</text>
  <text x="405" y="385" class="body">Create human support</text>
  <text x="405" y="409" class="body">tickets for risky cases</text>

  <rect x="610" y="360" width="130" height="44" rx="18" class="pill"/>
  <text x="675" y="389" class="pillText">messages</text>
  <rect x="860" y="360" width="130" height="44" rx="18" class="pill"/>
  <text x="925" y="389" class="pillText">events</text>
  <rect x="610" y="500" width="130" height="44" rx="18" class="pill"/>
  <text x="675" y="529" class="pillText">refunds</text>
  <rect x="860" y="500" width="130" height="44" rx="18" class="pill"/>
  <text x="925" y="529" class="pillText">tickets</text>
</svg>
